; Production-leaning defaults; override per environment with a mounted file if needed.
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 16M
expose_php = Off
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
