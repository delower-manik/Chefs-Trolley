# One origin for browser + API: /api/* -> Laravel (php-fpm), everything else -> the Next.js admin console.
# Serving both from the same site avoids CORS and lets the session cookie flag work. TLS terminates at your proxy/LB (or add certs here).
upstream api_fpm { server api:9000; }
upstream admin_web { server web:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # Laravel front controller. Only index.php is ever executed.
    location /api/ {
        include fastcgi_params;
        fastcgi_pass api_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 120s;
    }

    # Laravel's built-in liveness route.
    location = /up {
        fastcgi_pass api_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /up;
    }

    # Uploaded media (CMS/menu images) on the shared storage volume. Served straight from the volume, so no storage:link symlink is needed.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Never serve dotfiles or the storage tree.
    location ~ /\.(?!well-known) { deny all; }

    location / {
        proxy_pass http://admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
