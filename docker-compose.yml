# Local development / evaluation stack:  docker compose up --build
# Open http://localhost:8080  (admin console at /, API at /api/v1, health at /api/v1/health)
# First run: docker compose exec api php artisan migrate --seed   (see docs/DEPLOYMENT.md)
# NOT run in the authoring sandbox (no Docker daemon) — treat as a starting point and report any failure.

x-api: &api
  build: { context: ., dockerfile: backend/Dockerfile }
  env_file: ./backend/.env.docker
  environment:
    DB_HOST: db
    REDIS_HOST: redis
  volumes:
    - ./backend:/var/www/html          # live code in dev
    - /var/www/html/vendor             # keep the image's vendor/ (the bind mount above would hide it)
    - storage:/var/www/html/storage
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: chefs_trolley
      MYSQL_USER: chefs
      MYSQL_PASSWORD: chefs_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["3307:3306"]   # handy for a SQL client; remove if the port clashes

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    <<: *api

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--queue=default"]
    restart: unless-stopped

  scheduler:
    <<: *api
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    restart: unless-stopped

  # Public customer website (Phase 19). Reached directly on :3001; it talks to the API through nginx on :8080.
  # Put it behind its own domain in production and set WEBSITE_URL + CORS_ALLOWED_ORIGINS in backend/.env.docker to that origin.
  site:
    build:
      context: ./website
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
    ports: ["3001:3001"]
    restart: unless-stopped

  # Rider app (Phase 20), a phone-first PWA on :3002. Needs HTTPS in production (GPS, service worker and push all require it);
  # add its origin to CORS_ALLOWED_ORIGINS in backend/.env.docker.
  rider:
    build:
      context: ./rider
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports: ["3002:3002"]
    restart: unless-stopped

  # Staff app (Phase 21): waiter tables/orders, kitchen display, attendance. PWA on :3003; HTTPS in production; add its origin to CORS_ALLOWED_ORIGINS.
  staff:
    build:
      context: ./staff
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports: ["3003:3003"]
    restart: unless-stopped

  # Customer app (Phase 22): the installable ordering app (PWA) on :3004. HTTPS in production; add its origin to CORS_ALLOWED_ORIGINS.
  # Set NOTIFY_ORDER_PUSH=true in backend/.env.docker to push order progress to customers' phones.
  customer-app:
    build:
      context: ./customer-app
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports: ["3004:3004"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
    depends_on: [api, web]

volumes:
  dbdata:
  storage:
