name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_sqlite, zip, intl, bcmath", tools: composer:v2 }
      - run: composer install --no-interaction --prefer-dist
      - name: Pint (code style)
        run: vendor/bin/pint --test
      - name: OpenAPI spec is up to date
        run: |
          cp .env.example .env && php artisan key:generate
          php artisan openapi:generate --check

  backend-sqlite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_sqlite, zip, intl, bcmath", tools: composer:v2 }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  # Same suite against the production database engine. phpunit.xml defaults to SQLite; real environment variables win over it.
  backend-mysql:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chefs_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: chefs_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_mysql, zip, intl, bcmath", tools: composer:v2 }
      - run: composer install --no-interaction --prefer-dist
      - name: Migrations apply cleanly on MySQL
        run: cp .env.example .env && php artisan key:generate && php artisan migrate --force
      - run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build   # downloads Google Fonts, so it needs normal internet access

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rider:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rider } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: rider/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  staff:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: staff } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: staff/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  customer-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: customer-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: customer-app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", tools: composer:v2 }
      - name: composer audit
        working-directory: backend
        run: composer install --no-interaction --no-scripts --prefer-dist && composer audit
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm audit (production deps, high and above)
        working-directory: frontend
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      - name: npm audit (website)
        working-directory: website
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      - name: npm audit (customer-app)
        working-directory: customer-app
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      - name: npm audit (staff)
        working-directory: staff
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      - name: npm audit (rider)
        working-directory: rider
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend, website, rider, staff, customer-app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
          cache-from: type=gha
          cache-to: "type=gha,mode=max"
      - name: Build website image
        uses: docker/build-push-action@v6
        with: { context: website, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build rider image
        uses: docker/build-push-action@v6
        with: { context: rider, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build staff image
        uses: docker/build-push-action@v6
        with: { context: staff, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build customer-app image
        uses: docker/build-push-action@v6
        with: { context: customer-app, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Compose files are valid
        run: |
          cp backend/.env.docker.example backend/.env.docker
          docker compose -f docker-compose.yml config -q
          PUBLIC_URL=https://x.test DB_PASSWORD=a DB_ROOT_PASSWORD=b docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
